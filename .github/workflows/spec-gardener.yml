name: Spec Gardener
on:
  issues:
    types:
      - opened
      - edited
      - labeled
  issue_comment:
    types:
      - created

jobs:
  spec-gardener:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'spec-gardener')
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Spec Gardener
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          agent: "gemini"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
